name: Full pipeline

# Runs the whole pipeline (data generation -> ... -> monitoring) and then the complete
# test suite with no skipping. Slow, so manual + weekly instead of every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make all
